name: Build iOS (IPA sem assinatura)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar código do Drift (arquivos .g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Rodar testes
        run: flutter test

      - name: Compilar iOS (sem assinatura)
        run: flutter build ios --release --no-codesign

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry FinTrack-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FinTrack-ios-unsigned
          path: FinTrack-ios-unsigned.ipa
          retention-days: 30
